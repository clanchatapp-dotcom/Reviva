name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/release.keystore" \
            -storepass reviva123 -keypass reviva123 \
            -alias reviva-key -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Reviva, OU=App, O=Reviva Studio, L=NA, S=NA, C=US"

      - name: Configure release signing
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Injected by CI workflow - signs the release APK with a generated
          // keystore so the output can be sideloaded on any device.
          if (project.hasProperty('revivaKeystore')) {
            android.signingConfigs {
              release {
                storeFile file(project.revivaKeystore)
                storePassword 'reviva123'
                keyAlias 'reviva-key'
                keyPassword 'reviva123'
              }
            }
            android.buildTypes.release.signingConfig android.signingConfigs.release
          }
          EOF

      - name: Build release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease -PrevivaKeystore="$GITHUB_WORKSPACE/release.keystore" --no-daemon

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/reviva.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reviva-apk
          path: artifacts/reviva.apk
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the artifact \`reviva-apk\` from the workflow run page." >> $GITHUB_STEP_SUMMARY
          echo "The file is named \`reviva.apk\`. Sideload it onto your Android device." >> $GITHUB_STEP_SUMMARY
